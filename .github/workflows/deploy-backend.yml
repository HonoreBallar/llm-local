name: Deploy backend (VPS)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Envoyer les fichiers
        run: |
          rsync -az --delete --exclude ".env" --exclude "examples/" \
            backend/ vps:/opt/llm-local/incoming/

      - name: Déployer et vérifier
        run: ssh vps 'bash /opt/llm-local/incoming/deploy/remote-deploy.sh'
