name: llm-local

services:
  # Moteur d'inférence : charge le modèle et génère les réponses (CPU).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # Pas de port publié : seul la passerelle peut joindre Ollama.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Télécharge les modèles (texte + vision) au premier démarrage puis s'arrête.
  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b} && ollama pull ${LLM_VISION_MODEL:-gemma3:4b}"]
    restart: "no"

  # Passerelle API : clé API + formats OpenAI (/v1/chat/completions) et Claude (/v1/messages).
  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./gateway/litellm.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LLM_API_KEY:?Définis LLM_API_KEY dans .env}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    ports:
      - "${LLM_BIND:-127.0.0.1}:${LLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  ollama-models:
