server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS Docker à la volée : le front démarre même si l'API redémarre.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 11m;   # documents des fiches : 10 Mo maximum
        # CPU lent : une réponse du chatbot peut prendre du temps.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
